name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java version must be 17 or higher (detected $JAVA_MAJOR_VERSION)."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating a temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Existing debug.keystore detected."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create or find ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected output APK not found at $APK_PATH"
            exit 1
          fi
          echo "APK successfully built at $APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
